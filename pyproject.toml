[project]
name = "dependency-fixer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.34.0",
    "python-hcl2>=8.1.2",
]

[project.scripts]
dependency-fixer = "dependency_fixer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_fixer"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_decorated = true
warn_unused_ignores = true
ignore_missing_imports = false
files = ["src/", "tests/"]

[[tool.mypy.overrides]]
module = ["hcl2", "hcl2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# dependency_fixer.parser is the hcl2 boundary module — hcl2 ships no py.typed marker,
# so its LarkElement tree (StartRule, BlockRule, ExprTermRule, ...) is untyped by necessity
module = "dependency_fixer.parser"
disallow_any_expr = false
disallow_any_generics = false
disallow_any_unimported = false

[[tool.mypy.overrides]]
# pytest decorators (mark.parametrize etc.) are typed as Any in pytest's stubs
module = "tests.*"
disallow_any_expr = false
disallow_any_decorated = false

[[tool.mypy.overrides]]
# pydantic-ai's Agent.tool_plain decorator is typed to return Any (it supports
# both bare-decorator and factory-decorator call forms)
module = "dependency_fixer.agentic_check"
disallow_any_expr = false
disallow_any_decorated = false
